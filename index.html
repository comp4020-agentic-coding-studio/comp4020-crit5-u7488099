<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Write His Fate</title>
    <meta
      name="description"
      content="A typing game where your accuracy and speed write a knight's fate, one letter at a time."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Write His Fate</h1>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <div class="page">
        <canvas id="scene" role="img" aria-label="An animated illustration of the knight's journey, changing as it is typed."></canvas>
        <p id="manuscript" aria-live="polite"></p>
      </div>
      <div id="story-end" class="story-end">
        <p id="final-line"></p>
        <p id="the-end"></p>
        <button id="restart-button" type="button">Write it again</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
